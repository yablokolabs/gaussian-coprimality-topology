name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install declared minimum Rust version
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check declared minimum Rust version
        run: cargo check --workspace --all-targets --locked
      - name: Test declared minimum Rust version
        run: cargo test --workspace --all-targets --locked

  verify:
    name: Format, check, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add --toolchain stable rustfmt clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Test all targets
        run: cargo test --workspace --all-targets
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
